monitors:
  - name: jsonplaceholder-post
    url: https://jsonplaceholder.typicode.com/posts/1
    interval: 1m
    # retries: 3          # default: 3 additional attempts after first failure
    # retry_backoff: 2s   # default: 2s base for exponential backoff (2s→4s→8s…, capped at 30s)

  - name: httpbin-json
    url: https://httpbin.org/json
    interval: 5m

  # Example: monitor with custom retry settings
  # - name: flaky-api
  #   url: https://flaky.example.com/api
  #   interval: 2m
  #   retries: 5          # retry up to 5 times on transient failures (5xx, 429, timeouts)
  #   retry_backoff: 1s   # start with 1s, then 2s, 4s, 8s, 16s (capped at 30s)

  # Example: disable retries for a specific monitor
  # - name: no-retry-api
  #   url: https://strict.example.com/api
  #   retries: 0          # disable retry — first failure is final

  # Example: monitor with its own webhook (overrides global)
  # - name: internal-api
  #   url: https://internal.example.com/api
  #   interval: 2m
  #   webhooks:
  #     - type: discord
  #       url: ${DISCORD_INTERNAL_WEBHOOK_URL}

  # Example: monitor with notifications silenced
  # - name: noisy-api
  #   url: https://noisy.example.com/api
  #   interval: 30s
  #   webhooks: []

# Global webhooks — fire for every monitor that detects a change,
# unless the monitor defines its own webhooks list.
#
# Sensitive values (tokens, URLs) should never be hardcoded here.
# Use ${ENV_VAR} references and export the variables before running.
#
# Discord setup:
#   1. Open the channel → Edit Channel → Integrations → Webhooks → New Webhook
#   2. Copy the webhook URL
#   3. export DISCORD_WEBHOOK_URL="https://discord.com/api/webhooks/..."
#
# webhooks:
#   - type: discord
#     url: ${DISCORD_WEBHOOK_URL}
#
#   - type: telegram
#     url: https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage
#     chat_id: ${TELEGRAM_CHAT_ID}
